name: Build and Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/formallyverifiedprimrec/primrec-platform

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./primrec-frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_CHALLENGES_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Challenges Backend
        uses: docker/build-push-action@v6
        with:
          context: ./primrec-backend
          file: ./primrec-backend/Dockerfile.ChallengesBackend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/challenges-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Solver Backend
        uses: docker/build-push-action@v6
        with:
          context: ./primrec-backend
          file: ./primrec-backend/Dockerfile.SolverBackend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/solver-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
