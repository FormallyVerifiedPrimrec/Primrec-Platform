<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="color-scheme" content="dark light">
<title>Confirm your email — PrimRec</title>
</head>
<body style="margin:0;padding:0;background-color:#0d1117;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d1117;padding:40px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">
        <tr>
          <td style="padding:0 24px;">

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding:32px 0 8px;">
                  <img src="https://www.primrec.de/logo.png"
                       alt="PrimRec"
                       width="64"
                       height="64"
                       style="display:block;width:64px;height:64px;border-radius:14px;">
                </td>
              </tr>
            </table>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="background-color:#161b22;border:1px solid #30363d;border-radius:12px;margin:20px 0;">
              <tr>
                <td style="padding:32px 28px;">
                  <h2 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#f0f6fc;">
                    Confirm your email address
                  </h2>
                  <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#8b949e;">
                    One last step before you can start writing primitive recursive functions.
                  </p>
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td align="center">
                        <a href="{{ .ConfirmationURL }}"
                           style="display:inline-block;padding:12px 36px;background-color:#238636;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:8px;text-align:center;line-height:1.4;">
                          Confirm email address
                        </a>
                      </td>
                    </tr>
                  </table>
                  <p style="margin:24px 0 0;font-size:13px;color:#484f58;line-height:1.5;">
                    If you didn't create an account on PrimRec, you can safely ignore this email.
                  </p>
                </td>
              </tr>
            </table>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding:8px 0 24px;">
                  <p style="margin:0;font-size:12px;color:#30363d;line-height:1.5;">
                    Alternatively, copy and paste this link into your browser:
                  </p>
                  <p style="margin:4px 0 0;font-size:12px;color:#58a6ff;word-break:break-all;line-height:1.5;">
                    {{ .ConfirmationURL }}
                  </p>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
