services:
  frontend:
    image: ghcr.io/formallyverifiedprimrec/primrec-platform/frontend:latest
    environment:
      DOMAIN: ${DOMAIN:-:80}
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      VITE_CHALLENGES_API_URL: ${VITE_CHALLENGES_API_URL:-/api}
    depends_on:
      - challenges-backend
      - solver-backend
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    networks:
      - primrec-net

  challenges-backend:
    image: ghcr.io/formallyverifiedprimrec/primrec-platform/challenges-backend:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    networks:
      - primrec-net

  solver-backend:
    image: ghcr.io/formallyverifiedprimrec/primrec-platform/solver-backend:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - primrec-net

networks:
  primrec-net:
    driver: bridge
