services:
  frontend:
    build:
      context: ./primrec-frontend
    environment:
      DOMAIN: ${DOMAIN:-:80}
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      VITE_CHALLENGES_API_URL: ${VITE_CHALLENGES_API_URL:-/api}
    depends_on:
      - challenges-backend
      - solver-backend
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    networks:
      - primrec-net

  challenges-backend:
    build:
      context: ./primrec-backend
      dockerfile: Dockerfile.ChallengesBackend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    networks:
      - primrec-net

  solver-backend:
    build:
      context: ./primrec-backend
      dockerfile: Dockerfile.SolverBackend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - primrec-net

networks:
  primrec-net:
    driver: bridge
